# Push CI: the daily suites, on every push to main.
#
# Runs the pre-existing suites exactly as written locally — no test code is
# changed by this workflow:
#
#   1. API: typecheck + daily vitest suite (needs Postgres)
#   2. Web: lint + production build (hermetic — no services)
#   3. Stub e2e: full stack against the in-repo RagFlow stub
#
# Postgres comes from the existing dev compose (docker-compose.yml), which
# publishes the server on host port 5433 — the port the suite harness uses.
# The runner's built-in Postgres service pattern binds 5432, so there is no
# collision and no `services:` block is needed. Nothing live is touched and
# no secrets are involved.
name: Push CI

on:
  push:
    branches: [main]

jobs:
  daily-suites:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Web app requires Node 22 (Next 16); API engines are >=20.
          node-version: 22

      - name: Start dev-compose Postgres
        run: docker compose up -d --wait

      - name: Install API dependencies
        working-directory: apps/api
        run: npm ci

      - name: API typecheck
        working-directory: apps/api
        run: npm run typecheck

      - name: API daily vitest suite
        working-directory: apps/api
        run: npm test

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Web lint
        working-directory: apps/web
        run: npm run lint

      - name: Web production build
        working-directory: apps/web
        run: npm run build

      - name: Install Playwright chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Stub e2e (daily)
        working-directory: apps/web
        run: npm run test:e2e
