# Postgres for the MonitorERP KB API.
#
#   docker compose up -d
#
# The dev database is `monitorerp_kb`; the test suite creates its own
# `monitorerp_kb_test` database on the same server (see apps/api/test/helpers.ts).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: monitorerp
      POSTGRES_PASSWORD: monitorerp
      POSTGRES_DB: monitorerp_kb
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitorerp -d monitorerp_kb"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
